; Media limits. WordPress shows the smaller of upload_max_filesize and
; post_max_size in its uploader, so the two are kept in step deliberately: set
; only one and the admin UI reports a number that is not the real ceiling.
file_uploads = On
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120

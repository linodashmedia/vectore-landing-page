; The theme is baked into the image and never changes at runtime, so the
; validate_timestamps check is pure overhead: nothing on disk can change without
; a redeploy, and a redeploy is a new container with a cold cache anyway.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 8000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

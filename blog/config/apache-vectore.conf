# Vectore blog — Apache configuration.
#
# Two jobs: put the document root above the WordPress install so the /blog
# symlink resolves, and let WordPress's own .htaccess take over from there.

ServerName vectore-blog
DocumentRoot /var/www/site

# The symlinked WordPress install. AllowOverride All is what lets the .htaccess
# below drive permalinks; without it every post URL 404s while the homepage
# works, which is the single most confusing way for this to fail.
<Directory /var/www/html>
	Options +FollowSymLinks -Indexes
	AllowOverride All
	Require all granted
</Directory>

<Directory /var/www/site>
	Options +FollowSymLinks -Indexes
	AllowOverride None
	Require all granted
</Directory>

# Railway terminates TLS at the edge and talks HTTP to the container, so the
# client's real address arrives in X-Forwarded-For. Without this every comment,
# rate limit and log line records the proxy's address instead.
RemoteIPHeader X-Forwarded-For

# Never serve these, whatever the request path claims.
<FilesMatch "^(wp-config\.php|\.htaccess|\.user\.ini|readme\.html|license\.txt)$">
	Require all denied
</FilesMatch>

# xmlrpc.php is a standing brute-force and pingback-amplification target and
# nothing on this site uses it. Jetpack and the WordPress mobile app do; if
# either is ever adopted, remove this block deliberately rather than debugging
# a login that "just fails".
<Files "xmlrpc.php">
	Require all denied
</Files>

# PHP must never execute out of uploads. A file that gets there is data.
<Directory /var/www/html/wp-content/uploads>
	<FilesMatch "\.(?i:php|phtml|phar)$">
		Require all denied
	</FilesMatch>
</Directory>

# The blog is proxied, so it is the proxy that sets the browser-facing security
# headers for the whole origin. These two are cheap and belong to the app.
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Static assets are fingerprinted by filemtime in the theme's enqueues, so they
# can be cached hard. HTML is left alone: WordPress owns its own freshness.
<IfModule mod_expires.c>
	ExpiresActive On
	<FilesMatch "\.(?i:jpg|jpeg|png|gif|webp|avif|svg|woff2|woff|ico)$">
		ExpiresDefault "access plus 30 days"
	</FilesMatch>
	<FilesMatch "\.(?i:css|js)$">
		ExpiresDefault "access plus 7 days"
	</FilesMatch>
</IfModule>
